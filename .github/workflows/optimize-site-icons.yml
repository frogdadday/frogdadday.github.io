name: Optimize website icons
on:
  push:
    branches: [main]
    paths:
      - 'scripts/optimize_site_icons.py'
      - 'assets/*.png'
      - '.github/workflows/optimize-site-icons.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Create original-preserving WebP copies and update HTML
        run: python scripts/optimize_site_icons.py
      - name: Validate JavaScript
        run: node --check apps/apk-downloads.js
      - name: Commit optimized website files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/optimized/ index.html frog-pond.html 404.html apps/
          if git diff --cached --quiet; then
            echo "Already optimized; no changes."
          else
            git commit -m "Use compact WebP display icons while retaining original PNG artwork"
            git push
          fi
