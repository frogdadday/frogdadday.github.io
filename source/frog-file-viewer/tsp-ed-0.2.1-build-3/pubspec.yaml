name: frog_file_viewer
description: 'Frog File Viewer: private offline viewing, PDF editing, and conversions from Frogdadday.'
publish_to: none
version: 0.2.1+3

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dart_pdf_editor: ^10.0.0
  dart_pdf_editor_assets: ^10.0.0
  file_picker: ^13.1.0
  image: ^4.10.0
  camera: ^0.12.1
  crop_your_image: ^2.0.1
  pdf: ^3.13.1
  path_provider: ^2.1.6
  just_audio: ^0.10.6
  video_player: ^2.14.1
  pdfx: ^2.11.0
  archive: ^4.5.2
  quds_office_engine: 1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  cross_file: ^0.3.5+5
  flutter_lints: ^6.0.0
  pdf_document: ^10.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/THIRD_PARTY_NOTICES.txt
  shaders:
    - shaders/cosmic_lava.frag
